name: Sync notarized apps

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync]

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet 'pyjwt[crypto]==2.10.1'
      - name: Add new notarized versions to apps.json
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync.py
      - name: Commit apps.json
        run: |
          git diff --quiet apps.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Sync notarized apps'
          git push
